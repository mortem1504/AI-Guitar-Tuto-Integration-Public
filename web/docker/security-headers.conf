# The same headers as vercel.json, which the privacy claims in SECURITY.md rest
# on. Keep the two in step: a change to one is a change to both.
#
# Included from every location, because nginx drops the server's add_header
# lines in any location that sets one of its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://storage.googleapis.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), midi=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore HSTS over plain http, so this only takes effect behind a
# proxy that terminates TLS in front of the container.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
